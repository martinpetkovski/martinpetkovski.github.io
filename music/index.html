<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Demos · NAJJAK.COM</title>
<meta name="description" content="Music demos, recordings and unfinished ideas by Martin Petkovski.">
<link rel="icon" href="/favicon.png">
<link rel="preload" href="/font.min.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Najjak;src:url("/font.min.woff2") format("woff2"),url("/font.ttf") format("truetype");font-display:fallback}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;font:15px/1.25 Najjak,Consolas,"Courier New",monospace}
.page{max-width:640px;margin:auto}
.hdr-main{display:flex;align-items:center;gap:10px;height:76px;background:#4a7fc4 var(--scan) repeat}
.hdr-main{--scan:repeating-linear-gradient(0deg,#0000,#0000 2px,#0000000d 2px,#0000000d 4px);background-image:var(--scan),url("/hdr.svg");background-position:left top,right top;background-repeat:repeat,no-repeat;background-size:auto,auto 100%}
.hdr-logo{width:76px;height:76px;object-fit:contain;-webkit-mask-image:linear-gradient(90deg,#000 50%,#0000);mask-image:linear-gradient(90deg,#000 50%,#0000);opacity:.9}
.hdr-text{min-width:0;padding:5px 10px}
.hdr-text strong{display:block;color:#fff;font:900 48px/1 Impact,Haettenschweiler,"Arial Black",sans-serif;letter-spacing:1.5px}
.hdr-text small{display:block;overflow:hidden;color:#eee;font-size:11px;white-space:nowrap}
.back,.back:visited{display:flex;align-items:center;justify-content:center;height:20px;background:#1a3f77;color:#fff;font-size:10px;text-decoration:none}
.back:hover,.back:focus-visible{text-decoration:underline}
main{padding:5px}
h1,h2{margin:12px 0 3px;color:#039;font-size:20px;line-height:1.1}
h2{font-size:16px}
p{margin:2px 0 7px}
#status{min-height:1.4em;color:#555;font-size:12px}
#stop{padding:0;border:0;background:none;color:#00e;font:inherit;text-decoration:underline;cursor:pointer}
#stop[hidden]{display:none}
#tracks{margin:4px 0;padding-left:28px}
#tracks li{margin:2px 0}
.track{padding:0;border:0;background:none;color:#00e;font:inherit;text-align:left;text-decoration:underline;cursor:pointer}
.track:visited{color:#00e}.track:hover,.track:focus-visible,#stop:hover,#stop:focus-visible{color:#1478eb}
.track[aria-current="true"]{color:#cb092c}
.year{color:#555;font-size:12px}
footer{padding:5px;margin-top:14px;font-size:10px}
@media(max-width:600px){body{font-size:16px}.hdr-text{padding:6px}.hdr-text strong{font-size:28px}.hdr-text small{font-size:10px}main,footer{padding-left:12px;padding-right:12px}.track{font-size:15px}}
</style>
<script defer src="player.js"></script>
</head>
<body>
<div class="page">
<header><div class="hdr-main"><img class="hdr-logo" src="/header.webp" width="76" height="76" alt=""><div class="hdr-text"><strong>NAJJAK.COM</strong><small>Music demos, recordings and unfinished ideas.</small></div></div><a class="back" href="/#vault">BACK TO THE VAULT</a></header>
<main>
<h1>Music Demos</h1>
<p>Old songs, live recordings, drafts and unfinished ideas. Click a title to play it.</p>
<p id="status" role="status" aria-live="polite">Loading catalogue…</p>
<button id="stop" type="button" hidden>Stop</button>
<ol id="tracks"></ol>
<noscript><p>JavaScript is required for the music player. <a href="/archive/music/">Browse the archive directly.</a></p></noscript>
</main>
<footer>Copyright © Martin Petkovski 2013-2026</footer>
</div>
</body>
</html>
